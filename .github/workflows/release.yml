# Builds the Windows installer, the Ubuntu .deb, the Android APK and an unsigned
# iOS .ipa (for sideloading).
# The APK is signed with the key from the ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEYSTORE_PASSWORD repository secrets.
# - Push a tag like v1.2.3: builds both and attaches them to that GitHub Release
#   (created if it doesn't exist; 0.x versions are marked pre-release).
# - Run manually (Actions tab > Release > Run workflow): builds both and keeps
#   them as downloadable workflow artifacts, without making a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  linux:
    name: Ubuntu 24.04 .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        timeout-minutes: 10
        run: |
          # Retry and time out stalled mirror downloads instead of hanging.
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo apt-get $APT update
          sudo apt-get $APT install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libmpv-dev dpkg-dev
      - run: flutter test
      - run: bash tool/build_linux.sh
      - uses: actions/upload-artifact@v5
        with:
          name: linux-deb
          path: installer/Output/*.deb
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: flutter test
      - run: .\tool\build_installer.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: installer/Output/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The release key comes from repository secrets, so every APK is signed
      # with the same key and installs over the previous version.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dukeboxarr.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=dukeboxarr\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/dukeboxarr.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      - name: Name the APK
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          mkdir -p installer/Output
          cp build/app/outputs/flutter-apk/app-release.apk "installer/Output/DukeBoxarr-$version.apk"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/dukeboxarr.jks" android/key.properties
      - uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: installer/Output/*.apk
          if-no-files-found: error

  ios:
    name: iOS / iPadOS (unsigned .ipa)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Unsigned on purpose: it's installed by sideloading (SideStore/AltStore),
      # which signs it with the user's own Apple ID.
      - run: flutter build ios --release --no-codesign
      - name: Package the .ipa
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          mkdir -p Payload installer/Output
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "installer/Output/DukeBoxarr-$version.ipa" Payload
      - uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          path: installer/Output/*.ipa
          if-no-files-found: error

  release:
    name: Publish to GitHub Release
    # The iOS build doesn't block a release: if it fails, the others still publish.
    if: >-
      startsWith(github.ref, 'refs/tags/') && !cancelled() &&
      needs.linux.result == 'success' && needs.windows.result == 'success' &&
      needs.android.result == 'success'
    needs: [linux, windows, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          fail_on_unmatched_files: true
