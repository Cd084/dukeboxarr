# Builds the Windows installer and the Ubuntu .deb.
# - Push a tag like v1.2.3: builds both and attaches them to that GitHub Release
#   (created if it doesn't exist; 0.x versions are marked pre-release).
# - Run manually (Actions tab > Release > Run workflow): builds both and keeps
#   them as downloadable workflow artifacts, without making a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  linux:
    name: Ubuntu 24.04 .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libmpv-dev dpkg-dev
      - run: flutter test
      - run: bash tool/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: installer/Output/*.deb
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: flutter test
      - run: .\tool\build_installer.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/*.exe
          if-no-files-found: error

  release:
    name: Publish to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          fail_on_unmatched_files: true
